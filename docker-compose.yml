# Local Postgres for development and the API test suite.
# Creates two databases: card_dev (for running the API) and card_test (for tests).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_DB: card_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./api/scripts/create-test-database.sql:/docker-entrypoint-initdb.d/create-test-database.sql:ro

volumes:
  postgres-data:

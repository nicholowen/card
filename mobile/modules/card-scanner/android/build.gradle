plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.cardscanner'
version = '0.1.0'

android {
  namespace "expo.modules.cardscanner"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // Runs in Google Play services, so it needs no camera permission of its own.
  implementation 'com.google.android.gms:play-services-mlkit-document-scanner:16.0.0'
  // Bundled with the app, so text recognition works offline from first launch.
  implementation 'com.google.mlkit:text-recognition:16.0.1'
}
